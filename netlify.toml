# Fulcrum — Netlify deploy config
# Static site at the repo root, serverless functions under netlify/functions.

[build]
  publish = "."
  functions = "netlify/functions"

# Pretty API paths -> functions, so the front end can call /api/analyze.
[[redirects]]
  from = "/api/analyze"
  to = "/.netlify/functions/analyze"
  status = 200

[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200

# Long-cache the static assets (they're versioned by path / content).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
